      <stop offset="0" stop-color="#1c3b3a"/><stop offset="1" stop-color="#1c3b3a" stop-opacity=".82"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="26%" r="70%">
      <stop offset="0" stop-color="#a7e8bd" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a7e8bd" stop-opacity="0"/>
